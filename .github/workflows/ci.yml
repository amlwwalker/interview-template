name: CI

# Runs the same make targets you run locally. If these ever disagree with your
# machine, the bug is in the Makefile, not in the test.
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

jobs:
  backend:
    name: Go
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: runner
          POSTGRES_PASSWORD: runner
          POSTGRES_DB: crud_test
        ports: ["5432:5432"]
        # Without a healthcheck the job races the container and fails
        # intermittently, which is worse than failing every time.
        options: >-
          --health-cmd "pg_isready -U runner"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Lint
        run: make -C backend lint

      - name: Unit tests
        run: make -C backend test

      - name: Apply migrations
        env:
          PGPASSWORD: runner
        run: |
          for f in migrations/*.sql; do
            echo "applying $f"
            psql -h localhost -U runner -d crud_test -v ON_ERROR_STOP=1 -f "$f"
          done

      - name: Integration tests
        env:
          TEST_DB_URL: postgres://runner:runner@localhost:5432/crud_test?sslmode=disable
        run: |
          # Prove the connection string reaches the database before running
          # twelve tests that would each report the same failure.
          psql "$TEST_DB_URL" -c 'SELECT 1' >/dev/null
          make -C backend test-integration

      - name: Build
        run: make -C backend build

  frontend:
    name: Vitest
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci
        working-directory: frontend

      - name: Typecheck
        run: npm run typecheck
        working-directory: frontend

      - name: Tests
        run: npm test
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend

